<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark"><style>
:root {
    --ui-font: "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    --ui-mono: "Cascadia Code", "SF Mono", Consolas, "Liberation Mono", monospace;
    --ui-radius: 8px;
    --ui-radius-small: 6px;
    --ui-bg: #ffffff;
    --ui-surface: #f6f7f9;
    --ui-surface-2: #eceef2;
    --ui-fg: #1b1f24;
    --ui-muted: #5b6470;
    --ui-border: #d8dde3;
    --ui-accent: #2563eb;
    --ui-accent-hover: #1d4ed8;
    --ui-accent-fg: #ffffff;
    --ui-danger: #dc2626;
    --ui-success: #16a34a;
    --ui-focus: rgb(37 99 235 / 0.45);
    color-scheme: light;
    background-color: var(--ui-bg);
    color: var(--ui-fg);
    font-family: var(--ui-font);
    font-size: 16px;
}
:root > *, body { font-size: 14px; line-height: 1.5; }
:root[data-theme="dark"] {
    --ui-bg: #0f1115;
    --ui-surface: #171a21;
    --ui-surface-2: #1f232c;
    --ui-fg: #e6e9ee;
    --ui-muted: #9aa3ae;
    --ui-border: #2a2f39;
    --ui-accent: #4f8cff;
    --ui-accent-hover: #6ea0ff;
    --ui-accent-fg: #0b1020;
    --ui-danger: #f87171;
    --ui-success: #4ade80;
    --ui-focus: rgb(79 140 255 / 0.5);
    color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
        --ui-bg: #0f1115;
        --ui-surface: #171a21;
        --ui-surface-2: #1f232c;
        --ui-fg: #e6e9ee;
        --ui-muted: #9aa3ae;
        --ui-border: #2a2f39;
        --ui-accent: #4f8cff;
        --ui-accent-hover: #6ea0ff;
        --ui-accent-fg: #0b1020;
        --ui-danger: #f87171;
        --ui-success: #4ade80;
        --ui-focus: rgb(79 140 255 / 0.5);
        color-scheme: dark;
    }
}
body { margin: 0; }
h1 { font-size: 28px; font-weight: 650; margin: 0 0 12px; line-height: 1.25; }
h2 { font-size: 20px; font-weight: 600; margin: 0 0 8px; line-height: 1.3; }
h3 { font-size: 16px; font-weight: 600; margin: 0 0 6px; }
p { margin: 0 0 8px; }
ul, ol { margin: 0 0 8px; padding-left: 20px; }
a { color: var(--ui-accent); text-decoration: none; }
a:hover { text-decoration: underline; }
small { color: var(--ui-muted); font-size: 12px; }
code, kbd, pre {
    font-family: var(--ui-mono);
    font-size: 13px;
    background-color: var(--ui-surface-2);
    border-radius: var(--ui-radius-small);
    padding: 1px 5px;
}
hr { border-top: 1px solid var(--ui-border); margin: 12px 0; }
button {
    font-family: inherit;
    font-size: inherit;
    font-weight: 500;
    line-height: 20px;
    padding: 6px 14px;
    border: 1px solid var(--ui-border);
    border-radius: var(--ui-radius);
    background-color: var(--ui-surface);
    color: var(--ui-fg);
    cursor: pointer;
}
button:hover { background-color: var(--ui-surface-2); }
button:active { background-color: var(--ui-border); }
button:focus-visible { border-color: var(--ui-accent); }
button:disabled { opacity: 0.5; cursor: not-allowed; }
button.primary, button[data-variant="primary"] {
    background-color: var(--ui-accent);
    border-color: var(--ui-accent);
    color: var(--ui-accent-fg);
}
button.primary:hover, button[data-variant="primary"]:hover {
    background-color: var(--ui-accent-hover);
    border-color: var(--ui-accent-hover);
}
button.danger, button[data-variant="danger"] {
    background-color: var(--ui-danger);
    border-color: var(--ui-danger);
    color: #ffffff;
}
input, textarea, select {
    font-family: inherit;
    font-size: inherit;
    line-height: 20px;
    padding: 6px 10px;
    border: 1px solid var(--ui-border);
    border-radius: var(--ui-radius);
    background-color: var(--ui-bg);
    color: var(--ui-fg);
}
input:focus, textarea:focus, select:focus { border-color: var(--ui-accent); }
input:disabled, textarea:disabled, select:disabled { opacity: 0.5; cursor: not-allowed; }
output { font-variant-numeric: tabular-nums; font-weight: 600; }
.card {
    background-color: var(--ui-surface);
    border: 1px solid var(--ui-border);
    border-radius: calc(var(--ui-radius) + 4px);
    padding: 16px;
}
.badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    background-color: var(--ui-surface-2);
    color: var(--ui-muted);
    font-size: 12px;
    font-weight: 600;
}
.muted { color: var(--ui-muted); }
</style></head><body><main class="p-4 flex flex-col gap-2"><h1>Djinn UI showcase</h1><p>Running on desktop.</p><section class="card"><h2>Components</h2><span class="badge">open: 2</span><div class="counter"><output id="count">4</output><button id="inc">+</button><button id="reset">reset</button><small>even</small></div></section><section class="card"><h2>Lists</h2><ul class="tasks"><li class="task done">write the core</li><li class="task">test every host</li><li class="task">ship the kit</li></ul><ol><li>step 1</li><li>step 2</li><li>step 3</li></ol></section><article><h2>Report Q3</h2><dj-island data-component="LikeButton"><button>3 likes</button></dj-island></article><blockquote><p>&lt;script&gt;alert('x')&lt;/script&gt; &amp; more</p><a href="about:invalid#blocked">link</a></blockquote><footer>Made with Djinn UI</footer></main></body></html>
