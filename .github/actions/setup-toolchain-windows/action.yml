name: Setup Djinn toolchain (Windows)
description: Installs LLVM, downloads the seed djinnc from a published release and builds the runtime

inputs:
  llvm-version:
    description: LLVM version installed through Chocolatey
    default: "21.1.8"
  seed-tag:
    description: Release tag that holds the seed djinnc
    default: v0.2.0-seed.1
  token:
    description: Token used to download the seed
    default: ${{ github.token }}

outputs:
  seed:
    description: Path to the seed djinnc.exe
    value: ${{ steps.seed.outputs.seed }}
  runtime-lib:
    description: Path to djinn_runtime.lib
    value: ${{ steps.runtime.outputs.lib }}

runs:
  using: composite
  steps:
    - name: Install LLVM
      shell: bash
      run: |
        choco install llvm --version=${{ inputs.llvm-version }} --allow-downgrade -y --no-progress
        ls "/c/Program Files/LLVM/lib/LLVM-C.lib" "/c/Program Files/LLVM/bin/LLVM-C.dll"
        echo "C:\Program Files\LLVM\bin" >> "$GITHUB_PATH"

    - name: Set up the MSVC environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Point djinn.proj at the installed LLVM
      shell: bash
      run: |
        sed -i "s|'-LC:/dev/llvm-[^']*',|'-LC:/PROGRA~1/LLVM/lib',|" djinnc/djinn.proj
        grep -n "LLVM" djinnc/djinn.proj

    - name: Download seed djinnc
      id: seed
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        mkdir -p build/seed
        gh release download "${{ inputs.seed-tag }}" --repo "$GITHUB_REPOSITORY" \
          -p '*-windows-x86_64.zip' -p '*-windows-x86_64.zip.sha256' -D build/seed --clobber
        (cd build/seed && sha256sum -c *.sha256)
        unzip -q -o build/seed/*-windows-x86_64.zip -d build/seed/unpacked || [ $? -eq 1 ]
        cp build/seed/unpacked/*/bin/djinnc.exe build/seed/djinnc.exe
        echo "seed=$PWD/build/seed/djinnc.exe" >> "$GITHUB_OUTPUT"

    - name: Build runtime
      id: runtime
      shell: bash
      run: |
        bash tools/build_runtime.sh --out build/runtime
        echo "lib=$PWD/build/runtime/djinn_runtime.lib" >> "$GITHUB_OUTPUT"
