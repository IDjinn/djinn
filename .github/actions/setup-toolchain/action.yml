name: Setup Djinn toolchain
description: Installs LLVM, downloads the seed djinnc from a published release and builds the runtime

inputs:
  llvm-version:
    description: LLVM major version
    default: "21"
  seed-tag:
    description: Release tag that holds the seed djinnc
    default: v0.2.0-seed.1
  token:
    description: Token used to download the seed
    default: ${{ github.token }}

outputs:
  seed:
    description: Path to the seed djinnc
    value: ${{ steps.seed.outputs.seed }}
  runtime-lib:
    description: Path to libdjinn_runtime.a
    value: ${{ steps.runtime.outputs.lib }}

runs:
  using: composite
  steps:
    - name: Install LLVM
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends wget gnupg ca-certificates rsync \
          libxml2-dev zlib1g-dev libzstd-dev libffi-dev
        wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
        echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-${{ inputs.llvm-version }} main" | sudo tee /etc/apt/sources.list.d/llvm.list
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          clang-${{ inputs.llvm-version }} lld-${{ inputs.llvm-version }} llvm-${{ inputs.llvm-version }}-dev \
          libclang-rt-${{ inputs.llvm-version }}-dev
        sudo ln -sf /usr/bin/clang-${{ inputs.llvm-version }} /usr/local/bin/clang
        sudo ln -sf /usr/bin/clang++-${{ inputs.llvm-version }} /usr/local/bin/clang++
        sudo ln -sf /usr/bin/ld.lld-${{ inputs.llvm-version }} /usr/local/bin/ld.lld
        sudo ln -sf /usr/bin/llvm-ar-${{ inputs.llvm-version }} /usr/local/bin/llvm-ar

    - name: Patch djinn.proj for Linux LLVM
      shell: bash
      run: |
        sed -i "s|'-LC:/dev/llvm-[^']*',|'-L/usr/lib/llvm-${{ inputs.llvm-version }}/lib',|; s|'-lLLVM-C'|'-lLLVM-${{ inputs.llvm-version }}'|" djinnc/djinn.proj

    - name: Download seed djinnc
      id: seed
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        mkdir -p build/seed
        gh release download "${{ inputs.seed-tag }}" --repo "$GITHUB_REPOSITORY" \
          -p '*-linux-x86_64.tar.gz' -p '*-linux-x86_64.tar.gz.sha256' -D build/seed --clobber
        (cd build/seed && sha256sum -c *.sha256)
        tar -C build/seed -xzf build/seed/*-linux-x86_64.tar.gz --strip-components=2 --wildcards '*/bin/djinnc'
        chmod +x build/seed/djinnc
        echo "seed=$PWD/build/seed/djinnc" >> "$GITHUB_OUTPUT"

    - name: Build runtime
      id: runtime
      shell: bash
      run: |
        bash tools/build_runtime.sh --out build/runtime
        echo "lib=$PWD/build/runtime/libdjinn_runtime.a" >> "$GITHUB_OUTPUT"
