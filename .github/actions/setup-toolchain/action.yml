name: Setup Djinn toolchain
description: Installs LLVM, builds the stage0 compiler (djinn) and the seed djinnc

inputs:
  llvm-version:
    description: LLVM major version
    default: "21"

outputs:
  seed:
    description: Path to the seed djinnc
    value: ${{ steps.seed.outputs.seed }}

runs:
  using: composite
  steps:
    - name: Install dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          wget gnupg ca-certificates cmake ninja-build rsync g++-14 libstdc++-14-dev \
          libxml2-dev zlib1g-dev libzstd-dev libffi-dev python3
        wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
        echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-${{ inputs.llvm-version }} main" | sudo tee /etc/apt/sources.list.d/llvm.list
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          clang-${{ inputs.llvm-version }} lld-${{ inputs.llvm-version }} \
          llvm-${{ inputs.llvm-version }}-dev libclang-rt-${{ inputs.llvm-version }}-dev
        sudo ln -sf /usr/bin/clang-${{ inputs.llvm-version }} /usr/local/bin/clang
        sudo ln -sf /usr/bin/clang++-${{ inputs.llvm-version }} /usr/local/bin/clang++
        sudo ln -sf /usr/bin/ld.lld-${{ inputs.llvm-version }} /usr/local/bin/ld.lld
        sudo ln -sf /usr/bin/llvm-ar-${{ inputs.llvm-version }} /usr/local/bin/llvm-ar

    - name: Patch djinn.proj for Linux LLVM
      shell: bash
      run: |
        sed -i "s|'-LC:/dev/llvm-[^']*',|'-L/usr/lib/llvm-${{ inputs.llvm-version }}/lib',|; s|'-lLLVM-C'|'-lLLVM-${{ inputs.llvm-version }}'|" djinnc/djinn.proj

    - name: Build stage0 compiler and runtime
      shell: bash
      run: |
        cmake -S . -B build/cmake -G Ninja -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
          -DLLVM_DIR=/usr/lib/llvm-${{ inputs.llvm-version }}/lib/cmake/llvm
        cmake --build build/cmake --target djinn djinn_runtime

    - name: Build seed djinnc
      id: seed
      shell: bash
      run: |
        mkdir -p build/seed
        rm -f djinnc/build/djinnc
        build/cmake/djinn -r djinnc >build/seed/stage0.log 2>&1 || true
        if [ ! -f djinnc/build/djinnc ]; then
          cat build/seed/stage0.log
          echo "seed djinnc was not produced"
          exit 1
        fi
        cp djinnc/build/djinnc build/seed/djinnc
        echo "seed=$PWD/build/seed/djinnc" >> "$GITHUB_OUTPUT"
