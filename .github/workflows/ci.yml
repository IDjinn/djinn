name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  djinnc:
    name: djinnc bootstrap and conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      DJINN_USE_LLD: "1"
    steps:
      - uses: actions/checkout@v4

      - id: toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Bootstrap (seed, stage1, stage2, stage3, fixpoint, samples)
        run: |
          bash tools/bootstrap.sh \
            --seed "${{ steps.toolchain.outputs.seed }}" \
            --runtime-dir "$PWD/runtime" \
            --runtime-lib "${{ steps.toolchain.outputs.runtime-lib }}" \
            --bench-ref /dev/null \
            --lld

      - name: Diagnose sample compilation
        if: failure()
        run: |
          mkdir -p build/diag
          printf 'i32 main() {\n    return 3;\n}\n' > build/diag/main.djinn
          build/bootstrap/stage2/djinnc build/diag/main.djinn -o build/diag/main \
            --runtime-lib "${{ steps.toolchain.outputs.runtime-lib }}" --runtime-dir "$PWD/runtime" --lld || true
          build/bootstrap/stage2/djinnc build/diag/main.djinn -o build/diag/main_nolld \
            --runtime-lib "${{ steps.toolchain.outputs.runtime-lib }}" --runtime-dir "$PWD/runtime" || true
          ls -la build/diag build/bootstrap/samples | head -40

      - name: Conformance
        run: bash tests/conformance/ctest.sh "${{ steps.toolchain.outputs.seed }}"

      - name: Conformance (link, crash, library)
        run: bash tests/conformance/ctest.sh "${{ steps.toolchain.outputs.seed }}" --require Link --crash --library

      - name: djinnc unit tests
        run: bash tests/djinnc/unit_ctest.sh "${{ steps.toolchain.outputs.seed }}"

      - name: Android targets (NDK on the runner)
        run: DJINN_HOST_RUNTIME_LIB="${{ steps.toolchain.outputs.runtime-lib }}" bash tests/djinnc/android.sh build/bootstrap/stage2/djinnc runtime

      - name: Upload binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: djinnc-binaries
          path: |
            build/bootstrap/stage2/djinnc
            build/bootstrap/runner
            build/bootstrap/libs
            build/runtime/libdjinn_runtime.a
          if-no-files-found: ignore

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: djinnc-logs
          path: |
            build/bootstrap/*.log
            build/conformance/report.json
          if-no-files-found: ignore

  android-emulator:
    name: Android targets on an emulator
    needs: djinnc
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DJINN_USE_LLD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: djinnc-binaries
          path: build

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The djinnc built by the first job links LLVM dynamically: the shared library has to be on this runner too.
      - name: Install the LLVM runtime library
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wget gnupg ca-certificates libxml2 zlib1g libzstd1 libffi8
          wget -qO- --timeout=30 --tries=3 https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libllvm21 llvm-21
          ls /usr/lib/llvm-21/lib | grep -i "libLLVM" | head -3

      - name: Run the Android test on an x86_64 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          # each line of the script runs in its own shell: the variables go on the command that needs them
          script: |
            chmod +x build/bootstrap/stage2/djinnc
            env DJINN_NDK="$ANDROID_NDK_HOME" DJINN_HOST_RUNTIME_LIB="$PWD/build/runtime/libdjinn_runtime.a" LD_LIBRARY_PATH=/usr/lib/llvm-21/lib bash tests/djinnc/android.sh build/bootstrap/stage2/djinnc runtime

  djinnc-windows:
    name: djinnc bootstrap and conformance (Windows)
    runs-on: windows-2025
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    env:
      DJINN_USE_LLD: "1"
    steps:
      - uses: actions/checkout@v4

      - id: toolchain
        uses: ./.github/actions/setup-toolchain-windows

      - name: Bootstrap (seed, stage1, stage2, stage3, fixpoint, samples)
        run: |
          bash tools/bootstrap.sh \
            --seed "${{ steps.toolchain.outputs.seed }}" \
            --runtime-dir "$PWD/runtime" \
            --runtime-lib "${{ steps.toolchain.outputs.runtime-lib }}" \
            --bench-ref /dev/null \
            --lld

      - name: Conformance
        run: bash tests/conformance/ctest.sh "${{ steps.toolchain.outputs.seed }}"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: djinnc-windows-logs
          path: |
            build/bootstrap/*.log
            build/conformance/report.json
          if-no-files-found: ignore
