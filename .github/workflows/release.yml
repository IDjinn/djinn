name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (must already exist)
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build linux-x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - id: toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Stamp the version
        shell: bash
        run: sed -i "s/return \"[^\"]*\";/return \"${TAG#v}\";/" djinnc/src/support/version.djinn

      - name: Build djinnc (stage1 -> stage2) and verify fixpoint
        run: |
          bash tools/bootstrap.sh \
            --seed "${{ steps.toolchain.outputs.seed }}" \
            --runtime-dir "$PWD/runtime" \
            --runtime-lib "${{ steps.toolchain.outputs.runtime-lib }}" \
            --bench-ref /dev/null \
            --lld

      - name: Build djinn-lsp
        run: |
          bash djinn-lsp/build.sh "$PWD/build/bootstrap/stage2/djinnc" "$PWD/runtime"

      - name: Build djinn-scaffold
        run: |
          bash tools/scaffold/build.sh "$PWD/build/bootstrap/stage2/djinnc" "$PWD/runtime" "${{ steps.toolchain.outputs.runtime-lib }}"

      # Mobile: the runtime for Android (Bionic), cross-compiled with the NDK that ships on the runner. djinnc finds it in
      # lib/android/<abi>/ and links Android targets with that NDK (DJINN_NDK / ANDROID_NDK_HOME).
      - name: Build the Android runtime
        run: |
          export DJINN_NDK="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-}}"
          for abi in arm64-v8a x86_64; do
            bash tools/build_runtime.sh --android "$abi" --out "build/android-runtime/$abi"
          done

      # The 'android' installer component: the UI libraries built for each Android triple (and the host macro libraries
      # they need) plus the build and APK scripts. tools/android_build.sh finds them in lib/<triple>/ of the install.
      - name: Build the Android libraries
        run: |
          export DJINN_NDK="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-}}"
          export DJINNC="$PWD/build/bootstrap/stage2/djinnc" DJINN_HOST_RUNTIME_LIB="${{ steps.toolchain.outputs.runtime-lib }}"
          for abi in arm64-v8a x86_64; do
            DJINN_ANDROID_RUNTIME_LIB="$PWD/build/android-runtime/$abi/libdjinn_runtime.a" \
              bash tools/android_build.sh --libs-only --out "build/android-libs/$abi" --abi "$abi"
          done

      - name: Package
        run: |
          name="djinn-${TAG}-linux-x86_64"
          dist="dist/$name"
          mkdir -p "$dist/bin" "$dist/lib"
          cp build/bootstrap/stage2/djinnc "$dist/bin/djinnc"
          cp djinn-lsp/build/djinn-lsp "$dist/bin/djinn-lsp"
          cp tools/scaffold/build/djinn-scaffold "$dist/bin/djinn-scaffold"
          cp "${{ steps.toolchain.outputs.runtime-lib }}" "$dist/lib/libdjinn_runtime.a"
          for abi in arm64-v8a x86_64; do
            mkdir -p "$dist/lib/android/$abi"
            cp "build/android-runtime/$abi/libdjinn_runtime.a" "$dist/lib/android/$abi/"
          done
          mkdir -p "$dist/optional/android/lib" "$dist/optional/android/tools"
          cp build/android-libs/x86_64/libs/ui_macros.djlib* build/android-libs/x86_64/libs/spirv.djlib* "$dist/optional/android/lib/"
          for pair in arm64-v8a:aarch64 x86_64:x86_64; do
            cp -r "build/android-libs/${pair%%:*}/libs/${pair##*:}-linux-android26" "$dist/optional/android/lib/"
          done
          cp tools/android_build.sh tools/android_apk.sh tools/android_doctor.sh "$dist/optional/android/tools/"
          cp -r runtime std "$dist/"
          bash tools/package_web_libs.sh "$dist"
          cp README.md "$dist/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.sha256

  build-windows:
    name: Build windows-x86_64
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - id: toolchain
        uses: ./.github/actions/setup-toolchain-windows

      - name: Stamp the version
        shell: bash
        run: sed -i "s/return \"[^\"]*\";/return \"${TAG#v}\";/" djinnc/src/support/version.djinn

      - name: Build djinnc (stage1 -> stage2) and verify fixpoint
        run: |
          bash tools/bootstrap.sh \
            --seed "${{ steps.toolchain.outputs.seed }}" \
            --runtime-dir "$PWD/runtime" \
            --runtime-lib "${{ steps.toolchain.outputs.runtime-lib }}" \
            --bench-ref /dev/null \
            --lld

      - name: Build djinn-lsp
        run: |
          bash djinn-lsp/build.sh "$PWD/build/bootstrap/stage2/djinnc.exe" "$PWD/runtime"

      - name: Build djinn-scaffold
        run: |
          bash tools/scaffold/build.sh "$PWD/build/bootstrap/stage2/djinnc.exe" "$PWD/runtime" "${{ steps.toolchain.outputs.runtime-lib }}"

      # The optional installer components: libraries built with the compiler just produced, staged under optional/<name>
      # (the installers copy the picked ones over the version folder and remove optional/).
      - name: Build the optional UI libraries
        run: |
          compiler="$PWD/build/bootstrap/stage2/djinnc.exe"
          libs="$PWD/build/optional-libs"
          mkdir -p "$libs"
          for lib in ui_macros ui spirv vulkan win32; do
            "$compiler" "libs/$lib" -o "$libs/$lib.djlib" --lib-dir "$libs" --std-dir "$PWD/std" \
              --runtime-dir "$PWD/runtime" --runtime-lib "${{ steps.toolchain.outputs.runtime-lib }}" --lld
          done

      # Mobile: the runtime for Android (Bionic), cross-compiled with the NDK that ships on the runner. djinnc finds it in
      # lib/android/<abi>/ and links Android targets with that NDK (DJINN_NDK / ANDROID_NDK_HOME).
      - name: Build the Android runtime
        run: |
          export DJINN_NDK="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-}}"
          for abi in arm64-v8a x86_64; do
            bash tools/build_runtime.sh --android "$abi" --out "build/android-runtime/$abi"
          done

      # The 'android' installer component: the UI libraries built for each Android triple (and the host macro libraries
      # they need) plus the build and APK scripts. tools/android_build.sh finds them in lib/<triple>/ of the install.
      - name: Build the Android libraries
        run: |
          export DJINN_NDK="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-}}"
          export DJINNC="$PWD/build/bootstrap/stage2/djinnc.exe" DJINN_HOST_RUNTIME_LIB="${{ steps.toolchain.outputs.runtime-lib }}"
          for abi in arm64-v8a x86_64; do
            DJINN_ANDROID_RUNTIME_LIB="$PWD/build/android-runtime/$abi/libdjinn_runtime.a" \
              bash tools/android_build.sh --libs-only --out "build/android-libs/$abi" --abi "$abi"
          done

      - name: Package
        run: |
          name="djinn-${TAG}-windows-x86_64"
          dist="dist/$name"
          mkdir -p "$dist/bin" "$dist/lib"
          mkdir -p "$dist/optional/ui/lib" "$dist/optional/vulkan/lib" "$dist/optional/vulkan/native"
          cp build/optional-libs/ui_macros.djlib* build/optional-libs/ui.djlib* build/optional-libs/win32.djlib* "$dist/optional/ui/lib/"
          cp build/optional-libs/spirv.djlib* build/optional-libs/vulkan.djlib* "$dist/optional/vulkan/lib/"
          cp libs/vulkan/native/vulkan-1.lib libs/vulkan/native/vulkan-1.def "$dist/optional/vulkan/native/"
          cp build/bootstrap/stage2/djinnc.exe "$dist/bin/djinnc.exe"
          cp djinn-lsp/build/djinn-lsp.exe "$dist/bin/djinn-lsp.exe"
          cp tools/scaffold/build/djinn-scaffold.exe "$dist/bin/djinn-scaffold.exe"
          cp "/c/Program Files/LLVM/bin/LLVM-C.dll" "$dist/bin/LLVM-C.dll"
          cp "${{ steps.toolchain.outputs.runtime-lib }}" "$dist/lib/djinn_runtime.lib"
          for abi in arm64-v8a x86_64; do
            mkdir -p "$dist/lib/android/$abi"
            cp "build/android-runtime/$abi/libdjinn_runtime.a" "$dist/lib/android/$abi/"
          done
          mkdir -p "$dist/optional/android/lib" "$dist/optional/android/tools"
          cp build/android-libs/x86_64/libs/ui_macros.djlib* build/android-libs/x86_64/libs/spirv.djlib* "$dist/optional/android/lib/"
          for pair in arm64-v8a:aarch64 x86_64:x86_64; do
            cp -r "build/android-libs/${pair%%:*}/libs/${pair##*:}-linux-android26" "$dist/optional/android/lib/"
          done
          cp tools/android_build.sh tools/android_apk.sh tools/android_doctor.sh "$dist/optional/android/tools/"
          cp -r runtime std "$dist/"
          bash tools/package_web_libs.sh "$dist"
          cp README.md "$dist/"
          powershell -NoProfile -Command "Compress-Archive -Path 'dist/$name' -DestinationPath 'dist/$name.zip'"
          (cd dist && sha256sum "$name.zip" > "$name.zip.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-x86_64
          path: |
            dist/*.zip
            dist/*.sha256

  extension:
    name: Package VS Code extension
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Package djinn-lang.vsix
        working-directory: tools/vscode-djinn
        run: |
          npm ci
          npm version --no-git-tag-version --allow-same-version "${TAG#v}"
          npx --yes @vscode/vsce package -o djinn-lang.vsix
          mkdir -p ../../dist
          cp djinn-lang.vsix ../../dist/djinn-lang.vsix
          cp ../../installer/install.sh ../../installer/install.ps1 ../../dist/

      - uses: actions/upload-artifact@v4
        with:
          name: release-extension
          path: |
            dist/djinn-lang.vsix
            dist/install.sh
            dist/install.ps1

  installer-windows:
    name: Build Windows setup wizard
    needs: [build-windows, extension]
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@v4
        with:
          name: release-windows-x86_64
          path: in/windows

      - uses: actions/download-artifact@v4
        with:
          name: release-extension
          path: in/extension

      - name: Build setup.exe
        run: |
          choco install innosetup -y --no-progress
          name="djinn-${TAG}-windows-x86_64"
          mkdir -p in/unpacked dist
          powershell -NoProfile -Command "Expand-Archive -Path 'in/windows/$name.zip' -DestinationPath 'in/unpacked'"
          iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          # Git Bash would rewrite the /D switches as paths, and ISCC wants Windows paths
          export MSYS2_ARG_CONV_EXCL='*'
          source_dir="$(cygpath -w "$PWD/in/unpacked/$name")"
          vsix_file="$(cygpath -w "$PWD/in/extension/djinn-lang.vsix")"
          "$iscc" "/DTag=$TAG" "/DSource=$source_dir" "/DVsix=$vsix_file" "$(cygpath -w "$PWD/installer/windows/djinn.iss")"
          (cd dist && sha256sum "$name-setup.exe" > "$name-setup.exe.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-setup
          path: |
            dist/*-setup.exe
            dist/*-setup.exe.sha256

  publish:
    name: Publish GitHub release
    needs: [build, build-windows, extension, installer-windows]
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          version="${TAG#v}"
          awk -v version="$version" '
            index($0, "## [" version "]") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then
            notes=(--notes-file notes.md)
          else
            notes=(--generate-notes)
          fi
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            "${notes[@]}" \
            $prerelease
